# The gateway is the ONLY service of the domains that publishes a port to the host.
name: opti-api-gateway

services:
  api-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: opti/api-gateway:local
    environment:
      FRONT_ORIGIN: ${FRONT_ORIGIN:-http://localhost:3000}
    volumes:
      # Frame photos (HU-16): same volume products-api writes to, mounted read-only here and
      # served under /media/frames/ (see nginx/routes/media.conf).
      - frame-images:/data/frame-images:ro
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    networks:
      - platform
    restart: unless-stopped

networks:
  platform:
    external: true

volumes:
  frame-images:
