# Global settings of the gateway. It keeps no state and has no business logic.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # A well-formed X-Correlation-Id is kept; anything else (missing, too long, odd characters) is replaced.
    map $http_x_correlation_id $correlation_id {
        default $request_id;
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_correlation_id;
    }

    # One JSON line per request, with the correlation id: the same id appears in the log of the service.
    log_format json escape=json
        '{"timestamp":"$time_iso8601","service":"api-gateway","correlationId":"$correlation_id",'
        '"remote":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,"upstreamStatus":"$upstream_status"}';
    access_log /dev/stdout json;

    # Explicit limits
    client_max_body_size 1m;
    client_header_timeout 5s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 60s;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
