# Headers of every response. NGINX drops the add_header of an outer level as soon as a location
# declares its own, so this file is included in the server and in every location that adds headers.
add_header X-Correlation-Id $correlation_id always;
add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Expose-Headers "X-Correlation-Id, Location" always;
add_header Vary Origin always;
add_header X-Content-Type-Options nosniff always;
