# Common to every route: the correlation id goes to the service, time limits are explicit.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Correlation-Id $correlation_id;
proxy_connect_timeout 3s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
# What a service answers (including its own 4xx and 5xx) passes intact: it already uses the envelope.
proxy_intercept_errors off;
include /etc/nginx/snippets/headers.conf;
