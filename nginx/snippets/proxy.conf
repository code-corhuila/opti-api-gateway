# Common to every route: the correlation id goes to the service, time limits are explicit.
#
# proxy_ssl_server_name + Host: $proxy_host (not $host) matter once the upstream is a public HTTPS
# URL instead of a Docker Compose service name (Render): without SNI, the TLS handshake to an
# edge-routed host (Cloudflare in front of *.onrender.com) fails outright; without the matching
# Host header, the edge cannot tell which service to route to either. Harmless locally: Compose
# service names aren't virtual-hosted, so $proxy_host behaves the same as $host did.
proxy_ssl_server_name on;
proxy_ssl_name $proxy_host;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $proxy_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Correlation-Id $correlation_id;
proxy_connect_timeout 3s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
# What a service answers (including its own 4xx and 5xx) passes intact: it already uses the envelope.
proxy_intercept_errors off;
include /etc/nginx/snippets/headers.conf;
