# CORS preflight answer: only the headers the front needs.
include /etc/nginx/snippets/headers.conf;
add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id" always;
add_header Access-Control-Max-Age 600 always;
return 204;
