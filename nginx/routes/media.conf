# Frame photos (HU-16): static files written by products-api to the shared frame_images volume,
# served read-only here. Public (no bearer check): it is just an <img src>, and the path only ever
# reveals a frame id, never anything sensitive.
location /media/frames/ {
    alias /data/frame-images/;
    autoindex off;
    add_header Cache-Control "public, max-age=3600";
}
