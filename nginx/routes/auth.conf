# Routes of the auth domain. The upstream is a VARIABLE, so NGINX resolves it on every request:
# if auth-api is down only these routes answer 503 and all the others keep working.

# Sign-in is the only public route: the person has no credential yet. It has its own strict rate limit.
location = /api/v1/auth/login {
    if ($request_method = OPTIONS) { include /etc/nginx/snippets/preflight.conf; }
    limit_req zone=login burst=5 nodelay;
    set $auth_api http://auth-api:8080;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $auth_api;
}

location /api/v1/auth {
    if ($request_method = OPTIONS) { include /etc/nginx/snippets/preflight.conf; }
    if ($has_credential = 0) { return 401; }
    limit_req zone=api burst=60 nodelay;
    set $auth_api http://auth-api:8080;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $auth_api;
}

location /api/v1/users {
    if ($request_method = OPTIONS) { include /etc/nginx/snippets/preflight.conf; }
    if ($has_credential = 0) { return 401; }
    limit_req zone=api burst=60 nodelay;
    set $auth_api http://auth-api:8080;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $auth_api;
}

location /api/v1/notifications {
    if ($request_method = OPTIONS) { include /etc/nginx/snippets/preflight.conf; }
    if ($has_credential = 0) { return 401; }
    limit_req zone=api burst=60 nodelay;
    set $auth_api http://auth-api:8080;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $auth_api;
}
