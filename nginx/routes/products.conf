# Routes of the products domain. The upstream is a VARIABLE, so NGINX resolves it on every request:
# if products-api is down only these routes answer 503 and all the others keep working.

location /api/v1/frames {
    if ($request_method = OPTIONS) { include /etc/nginx/snippets/preflight.conf; }
    if ($has_credential = 0) { return 401; }
    limit_req zone=api burst=60 nodelay;
    set $products_api http://products-api:8080;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $products_api;
}

location /api/v1/reservations {
    if ($request_method = OPTIONS) { include /etc/nginx/snippets/preflight.conf; }
    if ($has_credential = 0) { return 401; }
    limit_req zone=api burst=60 nodelay;
    set $products_api http://products-api:8080;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $products_api;
}
