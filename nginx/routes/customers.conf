# Routes of the customers domain. The upstream is a VARIABLE, so NGINX resolves it on every request:
# if customers-api is down only these routes answer 503 and all the others keep working.

location /api/v1/patients {
    if ($request_method = OPTIONS) { include /etc/nginx/snippets/preflight.conf; }
    if ($has_credential = 0) { return 401; }
    limit_req zone=api burst=60 nodelay;
    set $customers_api http://customers-api:8080;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $customers_api;
}
