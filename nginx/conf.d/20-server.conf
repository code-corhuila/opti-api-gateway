server {
    listen 8000;
    server_name _;

    include /etc/nginx/snippets/headers.conf;

    # The gateway's own errors use the same envelope as the services. traceId is the correlation id,
    # so a complaint with its reference leads straight to the log line.
    error_page 401 = @unauthorized;
    error_page 404 = @not_found;
    error_page 413 = @too_large;
    error_page 429 = @too_many_requests;
    error_page 502 503 504 = @service_unavailable;

    location @unauthorized {
        include /etc/nginx/snippets/headers.conf;
        return 401 '{"error":"UNAUTHORIZED","message":"a valid bearer token is required","traceId":"$correlation_id"}';
    }

    location @not_found {
        include /etc/nginx/snippets/headers.conf;
        return 404 '{"error":"NOT_FOUND","message":"the requested resource does not exist","traceId":"$correlation_id"}';
    }

    location @too_large {
        include /etc/nginx/snippets/headers.conf;
        return 413 '{"error":"VALIDATION_ERROR","message":"the request body is too large","details":[{"field":"body","message":"must be at most 1 MB"}],"traceId":"$correlation_id"}';
    }

    location @too_many_requests {
        include /etc/nginx/snippets/headers.conf;
        add_header Retry-After 1 always;
        return 429 '{"error":"TOO_MANY_REQUESTS","message":"too many requests, retry later","traceId":"$correlation_id"}';
    }

    location @service_unavailable {
        include /etc/nginx/snippets/headers.conf;
        return 503 '{"error":"SERVICE_UNAVAILABLE","message":"the service is not available right now","traceId":"$correlation_id"}';
    }

    include /etc/nginx/routes/*.conf;

    # Anything that is not a declared route.
    location / {
        return 404;
    }
}
