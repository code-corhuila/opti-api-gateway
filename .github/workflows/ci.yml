name: CI
on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t opti-api-gateway:ci .
      - name: nginx -t accepts the configuration
        run: docker run --rm -e FRONT_ORIGIN=http://localhost:3000 opti-api-gateway:ci nginx -t
      - name: Start the gateway
        run: |
          docker run -d --name gateway -p 8000:8000 -e FRONT_ORIGIN=http://localhost:3000 opti-api-gateway:ci
          for _ in $(seq 1 20); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Smoke tests (no service behind the gateway, so its routes must answer 503)
        run: SMOKE_UPSTREAMS_DOWN=true FRONT_ORIGIN=http://localhost:3000 ./tests/smoke.sh
      - name: Gateway log on failure
        if: failure()
        run: docker logs gateway
